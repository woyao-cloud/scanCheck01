server:
  port: 8080

spring:
  application:
    name: code-compliance-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/compliance
    username: compliance
    password: compliance
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: "change-me-please-use-a-64-char-random-secret-for-hmac-sha-256"
    expiration-minutes: 120
  semgrep:
    command: semgrep
    working-dir: /tmp/compliance-scan
    timeout-seconds: 300
  credential:
    secret: "0123456789abcdef0123456789abcdef"   # 生产环境改由环境变量注入
  scan:
    checkout-engines: SEMGREP   # 仅这些引擎在编排器侧触发 GitCheckout；STUB 等跳过（Task 8.4 消费）

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.compliance: INFO
