server:
  port: 8080

spring:
  application:
    name: code-compliance-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/compliance
    username: compliance
    # F6 (spec §6.5)：敏感项经环境变量注入，默认值仅限非敏感占位（生产必须显式设置）
    password: "${DB_PASSWORD:compliance}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # F6 (spec §6.5)：JWT 签名密钥经 APP_JWT_SECRET 注入，默认值仅限非敏感占位（生产必须显式设置）
    secret: "${APP_JWT_SECRET:change-me-please-use-a-64-char-random-secret-for-hmac-sha-256}"
    expiration-minutes: 120
  semgrep:
    command: semgrep
    working-dir: /tmp/compliance-scan
    timeout-seconds: 300
  credential:
    # F6 (spec §6.5)：凭据加密密钥经 APP_CREDENTIAL_SECRET 注入，默认值仅限非敏感占位
    secret: "${APP_CREDENTIAL_SECRET:0123456789abcdef0123456789abcdef}"
  gitleaks:
    command: gitleaks
    timeout-seconds: 300
  trivy:
    command: trivy
    timeout-seconds: 600
  dependencycheck:
    timeout-seconds: 600   # spec §5.1：DC 依赖库大、--noupdate 仍慢，默认 600
  detekt:
    timeout-seconds: 300   # R-M14-3：spec 未定名，镜像 semgrep/gitleaks 代码类引擎
  scan:
    checkout-engines: SEMGREP,GITLEAKS,TRIVY,DEPENDENCYCHECK,DETEKT   # M11/M14：真实引擎都扫检出目录 → 触发 GitCheckout

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.compliance: INFO
